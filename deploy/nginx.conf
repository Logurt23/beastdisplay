# Example nginx server block for warroom.emmadvertising.com.
server {
  listen 443 ssl http2;
  server_name warroom.emmadvertising.com;
  # ssl_certificate / ssl_certificate_key: managed by certbot or your ACME client (auto-renew).

  root /srv/beastdisplay;   # contents of dist/ plus the host-written config.js

  # Add each frame: true allowlist origin to frame-src. The EMM deployment has none.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://nexus.emmadvertising.com; frame-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  # Runtime config: never cached, never falls back to index.html.
  location = /config.js {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    try_files /config.js =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location /fonts/ {
    add_header Cache-Control "public, max-age=31536000" always;
    try_files $uri =404;
  }

  # SPA fallback.
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
